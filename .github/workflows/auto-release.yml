name: Auto Release Linux

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Get project dependencies
        run: go mod download

      - name: Build v2node
        run: |
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/v2node -trimpath -ldflags "-X 'github.com/wyx2685/v2node/cmd.version=${{ github.sha }}' -s -w -buildid="

      - name: Copy README.md
        run: cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md

      - name: Download geoip.dat and geosite.dat
        run: |
          LIST=('geoip' 'geosite')
          for i in "${LIST[@]}"
          do
            DOWNLOAD_URL="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/${i}.dat"
            FILE_NAME="${i}.dat"
            echo -e "Downloading ${DOWNLOAD_URL}..."
            curl -L "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
          done

      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../v2node-linux-64.zip .
          popd || exit 1

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Linux Build
          body: "Automated daily build for Linux x86_64\n\nCommit: ${{ github.sha }}\n\nIncludes:\n- v2node binary\n- geoip.dat\n- geosite.dat\n- README.md"
          files: |
            ./v2node-linux-64.zip
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
